<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.5 "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; width: 300px; margin: 0; padding: 14px 16px; color: #1e1f22; background: #f7f6f3; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  h2 { font-size: 12px; font-weight: 600; margin: 14px 0 4px; }
  p { margin: 0 0 8px; color: #6d6e72; }
  b { color: #1e1f22; font-weight: 500; }
  a { color: #0a66c2; }
  pre { white-space: pre-wrap; font-size: 11px; max-height: 140px; overflow: auto; background: #eeece7; padding: 6px; border-radius: 4px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
  .sync { display: flex; align-items: center; gap: 8px; }
  #sync-now { color: #fff; background: #0a66c2; border-color: #0a66c2; padding: 3px 10px; }
  #sync-now:disabled { opacity: .6; cursor: default; }
  button { font: inherit; font-size: 12px; color: #0a66c2; background: none; border: 1px solid #d6d4cf; border-radius: 4px; padding: 1px 8px; cursor: pointer; }
</style>
</head>
<body>
  <h1>Puzzle Streaks</h1>
  <p id="today"></p>
  <p class="sync"><button id="sync-now" type="button">Sync now</button> <span id="sync-status"></span></p>
  <p id="last"></p>
  <p><a href="https://rsuriprojects.github.io/puzzle-streaks/" target="_blank">Open your page</a></p>
  <section id="screens" hidden>
    <h2>Something read wrong?</h2>
    <p>Copy what the extension saw on a game's results screen and send it over.</p>
    <ul id="screen-list"></ul>
  </section>
  <script src="popup.js"></script>
</body>
</html>
